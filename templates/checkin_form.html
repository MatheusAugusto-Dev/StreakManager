{% extends "base.html" %}

{% block content %}
<h2>Check-in — {{ goal.title }}</h2>

<form method="POST" class="goal-form">

    <label>
        {% if goal.metric_type == "time" %}
            Minutos realizados
        {% elif goal.metric_type == "pages" %}
            Páginas lidas
        {% elif goal.metric_type == "chapters" %}
            Capítulos lidos
        {% endif %}

        <input type="number"
            name="progress_value"
            min="0"
            value="{{ checkin.progress_value if checkin else '' }}"
            required>
    </label>

    <p class="rule">
        Mínimo esperado: {{ goal.target_value }}
        {% if goal.metric_type == "time" %}min{% endif %}
        {% if goal.metric_type == "pages" %}páginas{% endif %}
        {% if goal.metric_type == "chapters" %}capítulos{% endif %}
    </p>

    <label>
        Nível de foco (1–5)
        <input type="number" name="focus_level"
               min="1" max="5"
               value="{{ checkin.focus_level if checkin else '' }}">
    </label>

    <label>
        Observações
        <textarea name="notes">{{ checkin.notes if checkin else '' }}</textarea>
    </label>

    <button type="submit">Confirmar Check-in</button>
</form>
{% endblock %}
